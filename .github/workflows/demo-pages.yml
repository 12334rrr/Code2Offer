name: Deploy Demo

# 把 demo/(真实生成的报告静态页,免安装免 Key 试用)发布到 GitHub Pages。
# demo/index.html 是单文件自包含报告,直接由 Pages 静态托管。

on:
  push:
    branches: [main]
    paths: ['demo/**', '.github/workflows/demo-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v5
